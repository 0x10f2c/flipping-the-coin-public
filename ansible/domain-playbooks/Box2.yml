- hosts: all
  gather_facts: no
  tasks:

  - name: Change hostname to Box2
    win_hostname:
      name: 'Box2'
    register: res
    retries: 5
    delay: 10


  - name: Reboot machine
    win_reboot:
    when: res.reboot_required
    retries: 5
    delay: 10
    ignore_errors: yes


  - name: Wait for system to become reachable over WinRM
    wait_for_connection:
      timeout: 900
    retries: 3
    delay: 10
    register: result
    until: result is not failed

  - name: Set domain controllers as DNS servers
    win_dns_client:
      adapter_names: '*'
      ipv4_addresses: 10.0.1.100


  - win_domain_membership:
      dns_domain_name: demo.lab
      domain_admin_user: lab-admin@demo.lab
      domain_admin_password: CHANGEME_LAB_ADMIN_PASSWORD
      state: domain
    register: domain_state
    until: domain_state is succeeded 
    retries: 10
    delay: 10
    ignore_errors: true


  - win_reboot:
    when: domain_state.reboot_required
    ignore_errors: yes
    retries: 10
    delay: 10

  # Need to test disabling this, hopefully signed in user hash should only be in memory now
  #- name: Enable plaintext passwords in memory
  #  win_regedit:  
  #    path: HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest 
  #    name: UseLogonCredential
  #    data: 1
  #    type: dword
  #  retries: 5
  #  delay: 10


  - name: Make LocalAdminInst a Ladmin
    win_group_membership:
      name: Administrators
      members:
        - demo.lab\LocalAdminInst
      state: present
    retries: 5
    delay: 10


  - name: Enable AutoAdminLogon
    win_regedit:  
      path: HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon 
      name: AutoAdminLogon
      data: 1
      type: string
    retries: 5
    delay: 10

  - name: Set Domain Name Winlogon
    win_regedit:  
      path: HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon 
      name: DefaultDomainName
      data: demo.lab
      type: string
    retries: 5
    delay: 10

  - name: Set Username Winlogon
    win_regedit:  
      path: HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon 
      name: DefaultUserName
      data: HaroldHolt
      type: string
    retries: 5
    delay: 10

  - name: Set Domain Password Winlogon
    win_regedit:  
      path: HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon 
      name: DefaultPassword
      data: CHANGEME_HAROLDHOLT_PASSWORD
      type: string
    retries: 5
    delay: 10


  - name: Enable LSA Protect (RunAsPPL)
    win_regedit:  
      path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa 
      name: RunAsPPL
      data: 1
      type: dword
    retries: 5
    delay: 10


  - name: Reboot machine
    win_reboot:
    when: res.reboot_required
    retries: 5
    delay: 10
    ignore_errors: yes


  - name: Wait for system to become reachable over WinRM
    wait_for_connection:
      timeout: 900
    register: result
    retries: 3
    delay: 10
    until: result is not failed

  - name: Make HaroldHolt a RMU user
    win_group_membership:
      name: Remote Management Users
      members: 
        - demo.lab\HaroldHolt
    retries: 5
    delay: 10


#  - name: Make Box3 user log into box so it's creds are in LSASS
