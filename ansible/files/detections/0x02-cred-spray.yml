title: Detection 0x02
description: "Detection 0x02 - credential spray via SMB logon, based on source IP address."
logsource:
    category: authentication
    product: windows
detection:
    selection_security:
        - winlog.channel: 'Security'
    selection_smb_logon:
        - event.code: '<EVENT_CODE>'
    filter_username:
        user.name|contains:
            - '$'
    filter_blank_source_ip:
        source.ip|contains:
            - '*'
    condition: selection_security and selection_smb_logon and not filter_username and filter_blank_source_ip
