---
- name: Create new Active-Directory Domain & Forest
  hosts: all
  vars:
    dc_hostname: 'dc01'
    domain_name: "demo.lab"
    local_admin: '.\Administrator'
    temp_password: 'CHANGEME_LAB_ADMIN_PASSWORD'
    dc_password: 'CHANGEME_LAB_ADMIN_PASSWORD'
    recovery_password: 'CHANGEME_LAB_ADMIN_PASSWORD'
    upstream_dns_1: 8.8.8.8
    upstream_dns_2: 8.8.4.4
    reverse_dns_zone: "10.0.1.0/24"
    ntp_servers: "0.us.pool.ntp.org,1.us.pool.ntp.org,2.us.pool.ntp.org,3.us.pool.ntp.org"
  gather_facts: no
  tasks:


#  - name: Wait for system to become reachable over WinRM
#    wait_for_connection:
#      timeout: 900


 # - name: Disable firewall for Domain, Public and Private profiles
 #   win_firewall:
